version: 1
repository: repository:platform-monorepo

scopes:
  - id: organisation:acme
    parents: []
  - id: capability:payments
    parents: [organisation:acme]
  - id: service:ledger
    parents: [capability:payments]

bindings:
  - root: .
    scope: capability:payments
  - root: services/ledger
    scope: service:ledger

documents:
  - kind: specification
    root: specs
    include: ["**/*.md"]
    scope: capability:payments
